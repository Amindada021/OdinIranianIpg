name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore OdinIranianIpg.slnx
      - run: dotnet build OdinIranianIpg.slnx -c Release --no-restore
      - run: dotnet test OdinIranianIpg.slnx -c Release --no-build
      - run: dotnet pack src/OdinIranianIpg/OdinIranianIpg.csproj -c Release --no-build -o artifacts
