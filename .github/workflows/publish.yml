name: Publish NuGet
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read version from release tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected release tag like v1.0.0' >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - run: dotnet restore OdinIranianIpg.slnx
      - run: dotnet build OdinIranianIpg.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test OdinIranianIpg.slnx -c Release --no-build
      - run: dotnet pack src/OdinIranianIpg/OdinIranianIpg.csproj -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: Amindada
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
